<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact · The Woods Church</title>
    <meta name="description" content="Contact The Woods Church in Stanwood, Michigan — call, email, or send us a note." />
    <meta name="theme-color" content="#15522f" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body>
    <!-- @include partials/icons.html -->

    <div class="site tone-night">
      <!-- @include partials/header.html -->

      <main id="main">
        <section class="page-hero">
          <img class="page-hero__bg" src="assets/photos/web/worship-band-wide-1200.jpg" srcset="assets/photos/web/worship-band-wide-1200.jpg 1200w, assets/photos/web/worship-band-wide-2400.jpg 2400w" sizes="100vw" alt="" style="--pos: 50% 55%" />
          <div class="container page-hero__inner">
            <p class="eyebrow">Contact</p>
            <h1>We’d love to hear from you</h1>
            <p class="lede">Questions, prayer requests, or just saying hello.</p>
          </div>
        </section>

        <section class="section">
          <div class="container contact">
            <div class="contact__info reveal">
              <ul class="contact-list">
                <li><span class="icon-chip"><svg class="icon" aria-hidden="true"><use href="#i-pin" /></svg></span><div><strong>Visit</strong><span>7486 Stanwood Drive<br />Stanwood, MI 49346</span><br /><a href="https://www.google.com/maps/dir/?api=1&amp;destination=7486+Stanwood+Dr,+Stanwood,+MI+49346" target="_blank" rel="noopener noreferrer">Get directions</a></div></li>
                <li><span class="icon-chip"><svg class="icon" aria-hidden="true"><use href="#i-clock" /></svg></span><div><strong>Sunday worship</strong><span>10:00 AM</span></div></li>
                <li><span class="icon-chip"><svg class="icon" aria-hidden="true"><use href="#i-phone" /></svg></span><div><strong>Call</strong><a href="tel:2318234375">231-823-4375</a></div></li>
                <li><span class="icon-chip"><svg class="icon" aria-hidden="true"><use href="#i-mail" /></svg></span><div><strong>Email</strong><a href="mailto:office@thewoodsfmc.com">office@thewoodsfmc.com</a></div></li>
              </ul>
            </div>
            <form class="form card tone-paper reveal" style="--d: 120ms" action="mailto:office@thewoodsfmc.com" method="post" enctype="text/plain">
              <h2 class="h3">Send us a note</h2>
              <div class="form__row">
                <label>Name <input type="text" name="name" autocomplete="name" required /></label>
                <label>Email <input type="email" name="email" autocomplete="email" required /></label>
              </div>
              <label>Message <textarea name="message" rows="5" required></textarea></label>
              <button class="btn btn--primary" type="submit">Send message</button>
              <p class="form__note">This opens an email to the church office.</p>
            </form>
          </div>
        </section>
      </main>

      <!-- @include partials/footer.html -->
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
